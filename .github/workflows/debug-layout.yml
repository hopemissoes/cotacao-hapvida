name: Debug Layout (app2)

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/site-app2-**'
    paths:
      - 'debug_layout.py'
      - 'app_cotacao.py'
      - '.github/workflows/debug-layout.yml'

permissions:
  contents: write

concurrency:
  group: debug-layout-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager

      - name: Show Chrome version
        run: |
          which google-chrome || which chromium-browser || true
          google-chrome --version || chromium-browser --version || true

      - name: Run debug script
        run: python debug_layout.py
        continue-on-error: true

      - name: List output
        if: always()
        run: ls -la debug_output/ || echo "no output dir"

      - name: Replace committed snapshot folder
        if: always()
        run: |
          rm -rf debug-runs/latest
          mkdir -p debug-runs
          if [ -d debug_output ]; then
            mv debug_output debug-runs/latest
          fi

      - name: Commit results back to branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A debug-runs/
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "debug run $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          # Rebase em caso de race com novos pushes, depois empurra
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF#refs/heads/}" && break || sleep 2
          done
          git push origin "HEAD:${GITHUB_REF#refs/heads/}"

      - name: Upload artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: debug-runs/latest
          retention-days: 14
          if-no-files-found: warn
