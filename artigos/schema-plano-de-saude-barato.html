        {
          "@type": "Question",

            "@type": "Answer",
            "text": "Muda. O piso depende da praça, da modalidade de contratação e da faixa etária. Cotamos as quatro maiores operadoras em Fortaleza e em Recife em junho de 2026. A ordem entre elas se repetiu nas duas praças, mas o valor de entrada e — principalmente — qual porta de contratação sai mais barata mudaram: em Fortaleza o empresarial venceu nas dez faixas etárias; em Recife, em apenas três. Um ranking nacional único não descreve o que acontece na sua cidade."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto custou o plano mais barato em Fortaleza e em Recife na mesma semana de cotação?",

            "@type": "Answer",
            "text": "Em Recife, a faixa de 0 a 18 anos entra em [recife_ind_ambulatorialtotal_0] no plano individual ambulatorial com coparticipação total. Colocando as quatro operadoras na mesma modalidade — empresarial com coparticipação — e somando as dez faixas, a mais cara da praça pediu 2,11 vezes o que a mais barata pediu. A tabela completa está no topo desta página."
          }

            "text": "Entrega o mesmo Rol da ANS: a lista obrigatória não varia com o preço. O que varia é o acesso, e ele é local. Em Recife, com as quatro operadoras na mesma modalidade, a mais cara custou 2,11 vezes a mais barata, com o mesmo Rol nas duas. Barato não cobre menos doenças; cobre em menos lugares."
          }
        },

          "@type": "Question",

            "@type": "Answer",
            "text": "Depende da praça e da idade, e essa é a resposta inteira. Cotamos a Hapvida nas duas modalidades, em Fortaleza e em Recife, na mesma semana de junho de 2026. Em Fortaleza o caminho do CNPJ saiu na frente nas dez faixas etárias, sem exceção. Em Recife venceu em três, dos 19 aos 33 anos; fora dessa janela, quem saiu mais barato foi o individual. São duas capitais do Nordeste, mesma operadora, mesmo mês, e o resultado se inverte. A regra de que o empresarial é sempre mais barato, repetida por boa parte dos comparativos, não se sustentou na medição. Antes de abrir um CNPJ para economizar, cote as duas portas na sua cidade."
          }
        },

          "@type": "Question",

            "@type": "Answer",
            "text": "Porque o preço de cada modalidade é definido por tabela própria em cada praça, e nada garante que a tabela empresarial comece mais baixo. Em Recife, a tabela individual começou abaixo da empresarial em sete das dez faixas. É uma característica daquela praça, não uma regra geral."

          }
        },
        {
          "@type": "Question",

        },

        },
        {
          "@type": "Question",

            "text": "Nos planos de entrada da Hapvida, rede própria: são 86 hospitais próprios e 80 prontos-atendimentos 24 horas, em 16 estados. É por atender na própria estrutura que a mensalidade fica mais baixa."
          }
        },
        {
          "@type": "Question",
          "name": "Por que o preço quase sextuplica da faixa 0 a 18 para a faixa de 59 anos ou mais?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Porque a ANS permite que a última faixa custe até seis vezes a primeira, pela RN 63/2003, e as operadoras usam quase todo esse limite. Medimos multiplicadores entre 5,873 e 5,9995 nas quatro cotadas. Como todas usam praticamente o mesmo salto, a escolha se decide na faixa de entrada."
          }
        },
        {
          "@type": "Question",
          "name": "Dá para contratar plano de saúde barato sem CNPJ, ou o caminho do CNPJ é obrigatório?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Dá, onde o plano individual é vendido. A rede está em 16 estados, mas o individual e familiar é comercializado em 11 deles. Nos demais, o que existe à venda é o empresarial, e nesse caso o CNPJ deixa de ser estratégia e passa a ser requisito."
          }
        },

            "@type": "Answer",
            "text": "Os mesmos. Quem define carência é a ANS, não a mensalidade. Só dois caminhos encurtam o prazo: portabilidade, ou contrato empresarial com vidas suficientes para negociar."
          }
        },

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Pedindo a cotação da sua praça, com a sua faixa etária e a sua composição familiar. É a única forma de saber qual das portas de entrada sai na frente para o seu caso — porque, como esta página mostra, a resposta muda com a cidade e com a idade."
          }
        },
