<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;
 font-family:"Liberation Sans","DejaVu Sans",sans-serif;
 background:linear-gradient(135deg,#1a1a2e 0%,#16213e 55%,#101a33 100%);
 position:relative;color:#fff}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
.g1{width:520px;height:520px;background:#ff6b00;right:-190px;top:-200px;opacity:.28}
.g2{width:400px;height:400px;background:#2563eb;left:-160px;bottom:-190px;opacity:.30}
.rule{position:absolute;left:0;top:0;width:100%;height:6px;
 background:linear-gradient(90deg,#ff6b00,#ff8533 45%,transparent)}
.wrap{position:relative;height:100%;display:flex;align-items:center;
 padding:0 66px 96px;gap:44px}
.left{flex:1 1 0;min-width:0}
.eyebrow{font-size:19px;font-weight:bold;color:#ff8533;letter-spacing:3.2px;
 text-transform:uppercase;margin-bottom:22px}
h1{font-size:68px;font-weight:bold;line-height:1.02;letter-spacing:-2px;margin-bottom:16px}
h1 .or{color:#ff8533}
.sub{font-size:29px;font-weight:bold;color:#cbd5e1;line-height:1.3;margin-bottom:32px;max-width:600px}
.sub .q{color:#ff8533}
.pricebox{display:inline-flex;align-items:flex-end;gap:12px;
 border-left:6px solid #ff6b00;padding:6px 0 6px 22px}
.plabel{font-size:20px;color:#cbd5e1;margin-bottom:13px}
.pval{font-size:76px;font-weight:bold;letter-spacing:-2.4px;color:#fff;line-height:.95}
.pmes{font-size:25px;color:#94a3b8;margin-bottom:12px}
.right{flex:0 0 330px;display:flex;flex-direction:column;gap:17px}
.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
 border-radius:17px;padding:22px 25px}
.card .k{font-size:17px;font-weight:bold;color:#ff8533;letter-spacing:2.1px;
 text-transform:uppercase;margin-bottom:9px}
.card .v{font-size:24px;font-weight:bold;color:#fff;line-height:1.22}
.card .d{font-size:17px;color:#94a3b8;margin-top:6px}
.foot{position:absolute;left:66px;right:66px;bottom:34px;display:flex;
 justify-content:space-between;align-items:center;
 border-top:1px solid rgba(255,255,255,.16);padding-top:19px}
.brand{font-size:22px;font-weight:bold;color:#fff;letter-spacing:.3px}
.brand span{color:#ff8533}
.note{font-size:17px;color:#94a3b8}
</style></head><body>
<div class="rule"></div><div class="glow g1"></div><div class="glow g2"></div>
<div class="wrap">
  <div class="left">
    <div class="eyebrow">Guia 2026</div>
    <h1>Plano de Saúde<br><span class="or">Barato</span></h1>
    <div class="sub">CPF ou CNPJ: <span class="q">qual custa menos?</span></div>
    <div class="pricebox">
      <div class="plabel">a partir de</div>
      <div class="pval">R$&nbsp;71,98</div>
      <div class="pmes">/mês</div>
    </div>
  </div>
  <div class="right">
    <div class="card"><div class="k">Por CPF</div><div class="v">Individual</div>
      <div class="d">onde é comercializado</div></div>
    <div class="card"><div class="k">Por CNPJ</div><div class="v">Empresarial</div>
      <div class="d">o MEI serve</div></div>
  </div>
</div>
<div class="foot">
  <div class="brand">tabelaplanos<span>.com.br</span></div>
  <div class="note">Cotação própria &middot; junho de 2026</div>
</div>
</body></html>
